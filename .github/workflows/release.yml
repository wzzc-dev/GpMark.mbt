name: Release

# 发布 macOS arm64 .app 到 GitHub Release。
# 触发：打 `v*` tag（正式发布）或手动 workflow_dispatch（滚动 prerelease 快照）。
# 与 CI（ci.yml）同链路：build.sh 驱动 gpui-sys staticlib + moon build，
# bundle.sh 把 main.exe 包进带 Info.plist 的 MdMbt.app（裸 Mach-O 收不到
# 键盘事件，必须 bundle）。产物为 debug 构建，与仓库文档化的本地构建入口一致。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/gpui-moonbit/gpui-sys

      - name: Toolchain versions
        run: |
          moon version --all
          rustc --version

      - name: Build (native)
        run: ./build.sh

      - name: Selftest (headless, guards the FFI chain)
        run: |
          ./_build/native/debug/build/mdmbt/selftest/selftest.exe | tee selftest.log
          grep -q "SELFTEST PASS" selftest.log

      - name: Bundle and package
        run: |
          ./bundle.sh
          tag="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && tag="dev-snapshot"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          ditto -c -k --keepParent dist/MdMbt.app "MdMbt_${tag}_macos-arm64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          files: MdMbt_${{ env.TAG }}_macos-arm64.zip
          body: |
            GpMark（md_mbt，GPUI 后端 Markdown WYSIWYG）macOS arm64 应用包，未签名：
            解压后如遇 Gatekeeper 拦截，执行
            `xattr -dr com.apple.quarantine MdMbt.app` 再打开。
            带终端输出运行：`./MdMbt.app/Contents/MacOS/MdMbt`。
